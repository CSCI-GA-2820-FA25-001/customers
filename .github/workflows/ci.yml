name: CI - Customer Service Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=5

    env:
      DATABASE_URI: postgresql+psycopg://postgres:postgres@localhost:5432/testdb
      FLASK_ENV: test
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install flask flask_sqlalchemy psycopg[binary] pytest pytest-cov pytest-pspec faker honcho


      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to start..."
          until pg_isready -h localhost -p 5432 -U postgres; do
            sleep 2
          done

      - name: Run unit tests
        run: |
          pytest --disable-warnings --maxfail=1 --cov=service --cov-fail-under=90
