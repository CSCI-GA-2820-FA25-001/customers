name: CI - Customer Service Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=5

    env:
      DATABASE_URI: postgresql+psycopg://postgres:postgres@localhost:5432/testdb
      FLASK_ENV: test
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-restx flask_sqlalchemy psycopg[binary] pytest pytest-cov pytest-pspec faker honcho factory_boy


      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to start..."
          until pg_isready -h localhost -p 5432 -U postgres; do
            sleep 2
          done

      - name: Run unit tests
        run: |
          pytest --disable-warnings --maxfail=1 --cov=service --cov-report=xml --cov-fail-under=90

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-restx flask_sqlalchemy psycopg[binary] honcho factory_boy click

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint

      - name: Run flake8
        run: |
          flake8 service tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 service tests --count --max-complexity=30 --max-line-length=127 --statistics

      - name: Run pylint
        run: |
          pylint service tests --max-line-length=127 --disable=R0914,R1702,R0912
  
  coverage-upload:
    runs-on: ubuntu-latest
    needs:
      - tests
      - lint
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Install packages needed for Codecov
        run: sudo apt update && sudo apt install -y git curl gpg

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: CSCI-GA-2820-FA25-001/customers

