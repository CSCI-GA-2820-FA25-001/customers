apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers
  labels:
    app: customers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customers
  template:
    metadata:
      labels:
        app: customers
    spec:
      containers:
        - name: nyu-project
          image: customers:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: FLASK_ENV
              value: "wsgi:app"
            - name: FLASK_DEBUG
              value: "True"
            - name: GUNICORN_BIND
              value: "0.0.0.0:8080"
            - name: PORT
              value: "8080"
            - name: DATABASE_URI
              value: "postgresql+psycopg://postgres:pgs3cr3t@postgres:5432/postgres"
          # 🩺 Health Checks
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
