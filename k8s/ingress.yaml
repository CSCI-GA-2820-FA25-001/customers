apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: customers-ingress
  labels:
    app: customers
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: customers.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customers-service
                port:
                  number: 80
