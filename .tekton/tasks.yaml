---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: echo
spec:
  workspaces:
    - name: pipeline-workspace
  steps:
    - name: echo
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      script: |
        echo "Pipeline is running"

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: checkout
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: output
  steps:
    - name: clone
      image: alpine/git:latest
      script: |
        set -e
        apk add --no-cache ca-certificates
        cd $(workspaces.output.path)
        rm -rf repo || true
        git clone $(params.url) repo
        cd repo
        git checkout $(params.revision)

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: lint
spec:
  params:
    - name: path
      type: string
      default: service
  workspaces:
    - name: source
  steps:
    - name: run-lint
      image: python:3.11
      script: |
        set -e
        cd $(workspaces.source.path)/repo

        echo "Installing development dependencies (pipenv)…"
        pip install --upgrade pip pipenv
        pipenv install --dev --system

        echo "Running flake8…"
        flake8 $(params.path) tests

        echo "Running pylint…"
        pylint $(params.path) tests

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: tests
spec:
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.11
      env:
        - name: DATABASE_URI
          value: "sqlite:///$(workspaces.source.path)/test.db"
      script: |
        set -e
        cd $(workspaces.source.path)/repo

        echo "Installing dependencies..."
        pip install --upgrade pip pipenv
        pipenv install --dev --system

        echo "Running pytest…"
        pytest --pspec

---
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah
spec:
  params:
    - name: IMAGE
      type: string
      description: Fully qualified image name to build
    - name: DOCKERFILE
      type: string
      default: "Dockerfile"
    - name: CONTEXT
      type: string
      default: "."
  workspaces:
    - name: source
  steps:
    - name: build-and-push
      image: quay.io/containers/buildah:latest
      env:
        - name: STORAGE_DRIVER
          value: "vfs"
        - name: ISOLATION
          value: "chroot"
      workingDir: $(workspaces.source.path)/repo
      script: |
        #!/bin/bash
        set -e

        echo "=== Buildah Task ==="
        echo "Image: $(params.IMAGE)"
        echo "Dockerfile: $(params.DOCKERFILE)"
        echo "Context: $(params.CONTEXT)"
        echo "Environment STORAGE_DRIVER=$STORAGE_DRIVER"
        echo "Environment ISOLATION=$ISOLATION"
        echo "===================="

        buildah info

        echo "=== Building Image ==="
        buildah bud \
          --file "$(params.DOCKERFILE)" \
          --tag "$(params.IMAGE)" \
          "$(params.CONTEXT)"

        echo "=== Pushing Image ==="
        buildah push "$(params.IMAGE)"


---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-image
spec:
  workspaces:
    - name: source
  params:
    - name: IMAGE_NAME
      type: string
    - name: manifest-dir
      type: string
      default: "k8s"
  steps:
    - name: deploy
      image: quay.io/openshift/origin-cli:latest
      workingDir: /workspace/source/repo
      command:
        - /bin/bash
        - -c
      args:
        - |
          set -e

          echo "*** Installing yq ***"
          wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod a+x /usr/bin/yq

          echo "*** Updating deployment YAML with image $(params.IMAGE_NAME) ***"
          yq -i '.spec.template.spec.containers[0].image = "$(params.IMAGE_NAME)"' \
             $(params.manifest-dir)/deployment.yaml

          echo "*** Applying manifests ***"
          oc apply -f $(params.manifest-dir)/deployment.yaml
          oc apply -f $(params.manifest-dir)/service.yaml

          echo "*** Current Pods ***"
          oc get pods

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: behave
spec:
  workspaces:
    - name: source
  params:
    - name: base-url
      type: string
    - name: wait-seconds
      type: string
      default: "60"
    - name: driver
      type: string
      default: "chrome"
  steps:
    - name: behave
      image: quay.io/rofrano/pipeline-selenium
      workingDir: $(workspaces.source.path)/repo
      env:
        - name: BASE_URL
          value: $(params.base-url)
        - name: WAIT_SECONDS
          value: $(params.wait-seconds)
        - name: DRIVER
          value: $(params.driver)
      script: |
        #!/bin/bash
        set -e
        export PATH=$PATH:$HOME/.local/bin

        echo "*** Preparing Python environment ***"
        pip install --upgrade pip
        if [ -e "Pipfile" ]; then
          pip install pipenv
          pipenv requirements --dev > requirements.txt
        fi

        if [ ! -e "requirements.txt" ]; then
          echo "ERROR: No requirements.txt found"
          exit 1
        fi

        echo "*** Installing test dependencies ***"
        pip install --user -r requirements.txt behave selenium

        echo "*** Running behave BDD tests ***"
        behave
