apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  workspaces:
    - name: pipeline-workspace
  params:
    - name: git-url
      type: string
    - name: git-ref
      type: string
      default: master
    - name: image-name
      type: string
    - name: app-name
      type: string
  tasks:
    - name: clone
      taskRef:
        name: checkout
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-ref)
      workspaces:
        - name: output
          workspace: pipeline-workspace
    
    - name: lint
      taskRef:
        name: lint
      runAfter: [clone]
      workspaces:
        - name: source
          workspace: pipeline-workspace
    
    - name: test
      taskRef:
        name: tests
      runAfter: [clone]
      workspaces:
        - name: source
          workspace: pipeline-workspace
    
    # Skip build for now - no privileged access
    
    - name: deploy
      taskRef:
        name: deploy-image
      runAfter: [lint, test]
      params:
        - name: image-name
          value: $(params.image-name)
        - name: manifest-dir
          value: k8s
      workspaces:
        - name: source
          workspace: pipeline-workspace
    
    - name: bdd-test
      taskRef:
        name: behave
      runAfter: [deploy]
      params:
        - name: base-url
          value: http://$(params.app-name):8080
      workspaces:
        - name: source
          workspace: pipeline-workspace