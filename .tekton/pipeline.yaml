apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline-customers
spec:
  workspaces:
    - name: pipeline-workspace
      description: Shared workspace for all tasks
  params:
    - name: git-url
      type: string
    - name: git-ref
      type: string
      default: master
    - name: image-name
      type: string
    - name: app-name
      type: string
    - name: base-url
      type: string
      default: "http://customers:8080"
  tasks:
    - name: clone
      taskRef:
        name: checkout
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-ref)
      workspaces:
        - name: pipeline-workspace   # matches checkout declaration
          workspace: pipeline-workspace

    - name: lint
      taskRef:
        name: lint
      runAfter: [clone]
      workspaces:
        - name: source             # matches lint declaration
          workspace: pipeline-workspace

    - name: test
      taskRef:
        name: tests
      runAfter: [clone]
      workspaces:
        - name: source
          workspace: pipeline-workspace

    - name: build
      taskRef:
        name: build
      runAfter: [lint, test]
      workspaces:
        - name: source
          workspace: pipeline-workspace
      params:
        - name: IMAGE
          value: $(params.image-name)

    - name: deploy
      taskRef:
        name: deploy-image
      runAfter: [build]
      workspaces:
        - name: source
          workspace: pipeline-workspace
      params:
        - name: image-name
          value: $(params.image-name)
        - name: manifest-dir
          value: k8s

    - name: bdd-test
      taskRef:
        name: behave
      runAfter: [deploy]
      workspaces:
        - name: source
          workspace: pipeline-workspace
      params:
        - name: base-url
          value: $(params.base-url)
