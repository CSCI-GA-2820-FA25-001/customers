apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: cd-binding
spec:
  params:
    - name: git-repo-url
      value: $(body.repository.clone_url)

    - name: git-revision
      # GitHub sends refs/heads/main → we extract the last segment
      value: $(extensions.shortRef)

    - name: git-repo-name
      value: $(body.repository.name)
