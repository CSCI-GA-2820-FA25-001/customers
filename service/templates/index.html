<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Administration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Customer Administration</h1>
            <p class="subtitle">eCommerce Platform Customer Management</p>
        </header>

        <!-- Flash Messages -->
        <div id="flash-message" class="flash-message hidden"></div>

        <!-- Create/Update Customer Form -->
        <section class="card">
            <h2>Create / Update Customer</h2>
            <form id="customer-form">
                <input type="hidden" id="customer-id" name="id">
                
                <div class="form-group">
                    <label for="first-name">First Name *</label>
                    <input type="text" id="first-name" name="first_name" required>
                </div>

                <div class="form-group">
                    <label for="last-name">Last Name *</label>
                    <input type="text" id="last-name" name="last_name" required>
                </div>

                <div class="form-group">
                    <label for="address">Address *</label>
                    <input type="text" id="address" name="address" required>
                </div>

                <div class="form-actions">
                    <button type="submit" id="create-btn" class="btn btn-primary">Create Customer</button>
                    <button type="button" id="update-btn" class="btn btn-success hidden">Update Customer</button>
                    <button type="button" id="clear-btn" class="btn btn-secondary">Clear Form</button>
                </div>
            </form>
        </section>

        <!-- Search/Query Section -->
        <section class="card">
            <h2>Search Customers</h2>
            <form id="search-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="search-id">Customer ID</label>
                        <input type="text" id="search-id" name="id" placeholder="Search by ID">
                    </div>

                    <div class="form-group">
                        <label for="search-first-name">First Name</label>
                        <input type="text" id="search-first-name" name="first_name" placeholder="Search by first name">
                    </div>

                    <div class="form-group">
                        <label for="search-last-name">Last Name</label>
                        <input type="text" id="search-last-name" name="last_name" placeholder="Search by last name">
                    </div>

                    <div class="form-group">
                        <label for="search-address">Address</label>
                        <input type="text" id="search-address" name="address" placeholder="Search by address">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Search</button>
                    <button type="button" id="list-all-btn" class="btn btn-info">List All Customers</button>
                    <button type="button" id="clear-search-btn" class="btn btn-secondary">Clear Search</button>
                </div>
            </form>
        </section>

        <!-- Customer List -->
        <section class="card">
            <h2>Customer List</h2>
            <div id="customer-list-container">
                <p class="empty-message">Click "List All Customers" to view customers</p>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
